[project]
name = "pdf-chart-parser"
version = "0.1.0"
description = "MCP server for extracting energy-usage charts from utility-bill PDFs"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "mcp>=1.9.0",
    "pydantic>=2.7.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
raster = [
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
]
# Adds a searchable text layer to scanned PDFs so they flow through the
# vector/text-layer path. Requires system tools: ghostscript, qpdf, tesseract.
ocr = [
    "ocrmypdf>=16.0.0",
]

[project.scripts]
pdf-chart-parser = "pdf_chart_parser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_chart_parser"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
